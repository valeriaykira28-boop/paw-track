<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paw Track - Rastreo GPS por SMS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; color: #0f172a; display: flex; flex-direction: column; min-height: 100vh; }
        
        header { background: #0f172a; color: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; }
        header span { background: #2563eb; font-size: 12px; padding: 4px 10px; border-radius: 20px; }

        .main-container { display: grid; grid-template-columns: 380px 1fr; flex-grow: 1; }
        
        .sidebar { background: white; padding: 24px; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .card { background: #f8fafc; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .card h3 { font-size: 15px; color: #334155; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        
        textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; resize: none; font-size: 14px; margin-bottom: 10px; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        
        .historial-lista { list-style: none; display: flex; flex-direction: column; gap: 10px; max-height: 280px; overflow-y: auto; }
        .historial-item { background: white; padding: 12px; border-radius: 8px; border-left: 4px solid #2563eb; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer; }
        .historial-item:hover { background: #eff6ff; }
        .fecha { color: #64748b; font-size: 11px; margin-bottom: 4px; }

        #map { width: 100%; height: 100%; min-height: 450px; }

        @media (max-width: 768px) {
            header { padding: 14px 16px; flex-wrap: wrap; gap: 8px; }
            header h1 { font-size: 18px; }
            .main-container { grid-template-columns: 1fr; }
            .sidebar { border-right: none; border-bottom: 1px solid #e2e8f0; padding: 16px; }
            #map { min-height: 420px; }
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-paw" style="color: #60a5fa;"></i> PAW TRACK <span>Rastreo SMS Activo</span></h1>
        <div style="font-size: 14px; color: #94a3b8;">Estado: <strong style="color: #4ade80;">Conectado</strong></div>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <div class="card" style="background: #eff6ff; border-color: #bfdbfe;">
                <h3 style="color: #1e40af;"><i class="fa-solid fa-location-crosshairs"></i> Última Posición Detectada</h3>
                <p id="ultima-coord" style="font-size: 18px; font-weight: 700; color: #0f172a;">Cargando...</p>
                <p id="ultima-fecha" style="font-size: 12px; color: #475569; margin-top: 4px;">--</p>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-comment-sms"></i> Procesar Mensaje SMS</h3>
                <p style="font-size: 12px; color: #64748b; margin-bottom: 8px;">Pega aquí el texto o enlace que envió el chip SIM de la mascota:</p>
                <textarea id="input-sms" rows="3" placeholder="Ej: Alerta PawTrack LAT: 13.7050, LON: -89.2180"></textarea>
                <button onclick="enviarSMS()"><i class="fa-solid fa-paper-plane"></i> Ubicar en el Mapa</button>
            </div>

            <div class="card" style="flex-grow: 1;">
                <h3><i class="fa-solid fa-clock-rotate-left"></i> Historial de Ubicaciones</h3>
                <ul id="lista-historial" class="historial-lista"></ul>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([13.7013, -89.2244], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let marcadorMascota = null;
        let lineaRuta = null;

        async function cargarUbicaciones() {
            const respuesta = await fetch('/api/ubicaciones');
            const datos = await respuesta.json();

            if (datos.length > 0) {
                const ultima = datos[0];
                document.getElementById('ultima-coord').innerText = `${ultima.lat.toFixed(5)}, ${ultima.lon.toFixed(5)}`;
                document.getElementById('ultima-fecha').innerText = `Actualizado: ${ultima.fecha}`;

                if (marcadorMascota) {
                    marcadorMascota.setLatLng([ultima.lat, ultima.lon]);
                } else {
                    marcadorMascota = L.marker([ultima.lat, ultima.lon]).addTo(map);
                }
                marcadorMascota.bindPopup(`<b>🐾 Ubicación Actual</b><br>${ultima.fecha}<br><small>${ultima.mensaje}</small>`).openPopup();
                map.setView([ultima.lat, ultima.lon], 16);

                const puntosRuta = datos.map(d => [d.lat, d.lon]);
                if (lineaRuta) map.removeLayer(lineaRuta);
                lineaRuta = L.polyline(puntosRuta, { color: '#2563eb', weight: 4 }).addTo(map);

                const listaHTML = document.getElementById('lista-historial');
                listaHTML.innerHTML = '';
                datos.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'historial-item';
                    li.innerHTML = `
                        <div class="fecha"><i class="fa-regular fa-clock"></i> ${item.fecha}</div>
                        <strong>Lat:</strong> ${item.lat.toFixed(4)} | <strong>Lon:</strong> ${item.lon.toFixed(4)}
                    `;
                    li.onclick = () => {
                        map.setView([item.lat, item.lon], 17);
                        document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
                    };
                    listaHTML.appendChild(li);
                });
            }
        }

        async function enviarSMS() {
            const texto = document.getElementById('input-sms').value;
            if (!texto.trim()) return alert("Por favor pega el mensaje SMS con las coordenadas.");

            const res = await fetch('/api/recibir-sms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mensaje: texto })
            });

            const resultado = await res.json();
            if (res.ok) {
                document.getElementById('input-sms').value = '';
                cargarUbicaciones();
                document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
            } else {
                alert(resultado.mensaje);
            }
        }

        cargarUbicaciones();
        setInterval(cargarUbicaciones, 5000);
    </script>
</body>
</html>
